; BOLT firmware - Teensy 4.1
; Build & flash:   pio run -t upload        (or from the Pi: see docs/06_software_guide.md)
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -O2 -std=gnu++17 -Wall -DUSB_SERIAL
build_unflags = -std=gnu++14
; FlexCAN_T4, WS2812Serial, SPI, EEPROM and Watchdog_t4 ship with the Teensy core
lib_ldf_mode = deep+
monitor_speed = 2000000
